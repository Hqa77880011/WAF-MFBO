[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waf_mfbo"
version = "0.1.0"
description = "Failure- and runtime-aware asynchronous multi-fidelity optimization implementation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "scikit-learn>=1.3"]

[project.scripts]
waf_mfbo = "waf_mfbo.cli:main"

[tool.setuptools.packages.find]
include = ["waf_mfbo*"]
